let chk = {};              
let _dbRef = null;         
let _isSaving = false;     

function updateSyncStatus(status) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    connecting: { text: '⏳ 연결 중...', color: '#C8B87E' },
    online:     { text: '☁️ 동기화 연결됨', color: '#7EC8A0' },
    saved:      { text: '💾 저장됨', color: '#7EC8A0' },
    synced:     { text: '🔄 다른 기기 반영됨', color: '#60C8E0' },
    offline:    { text: '📴 오프라인 (로컬 저장)', color: '#E8A860' },
  };
  const s = map[status] || map.online;
  el.textContent = s.text;
  el.style.color = s.color;
}

function saveState() {
  try { localStorage.setItem(DailyConfig.storageKey, JSON.stringify(chk)); } catch(e) {}
  if (_dbRef) {
    _isSaving = true;
    _dbRef.set(chk)
      .then(() => { updateSyncStatus('saved'); })
      .catch(() => { updateSyncStatus('offline'); })
      .finally(() => { setTimeout(() => { _isSaving = false; }, 1200); });
  }
}

function syncUIFromChk() {
  S.forEach(b => {
    b.items.forEach((_, i) => {
      const iid = b.id + '-' + i;
      const cb = document.getElementById(iid);
      const tx = document.getElementById('tx-' + iid);
      if (cb) cb.checked = !!chk[iid];
      if (tx) tx.classList.toggle('done', !!chk[iid]);
    });
    checkBlockDone(b);
    const pmInput = document.getElementById('pmemo-input-' + b.id);
    if (pmInput) pmInput.value = chk['pmemo-' + b.id] || '';
  });
  
  const memoEl = document.getElementById('memo-input');
  if (memoEl) memoEl.value = chk['global_memo'] || '';
  
  const iptPrev = document.getElementById('inputPrevStamps');
  if (iptPrev) iptPrev.value = chk['prev_stamps_count'] || 0;
  updateStampUI();
  updateStats();
}

async function initApp() {
  updateSyncStatus('connecting');

  try {
    const local = localStorage.getItem(DailyConfig.storageKey);
    if (local) chk = JSON.parse(local);
  } catch(e) {}
  render();

  // 스마트 메모장 토글 이벤트 리스너 바인딩
  const memoBox = document.getElementById('smartMemoBox');
  const memoBtn = document.getElementById('memoToggleBtn');
  const memoIcon = document.getElementById('memoToggleIcon');
  
  memoBtn.addEventListener('click', () => {
    memoBox.classList.toggle('minimized');
    if(memoBox.classList.contains('minimized')) {
        memoIcon.textContent = '▲ 펼치기';
    } else {
        memoIcon.textContent = '▼ 닫기';
        document.getElementById('memo-input').focus(); // 열면 바로 타자 칠 수 있게 포커스
    }
  });

  document.getElementById('memo-input').addEventListener('input', (e) => { 
      chk['global_memo'] = e.target.value; 
      saveState(); 
  });

  if (FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') {
    updateSyncStatus('offline');
    const original = saveState;
    window.saveState = function() {
      try { localStorage.setItem(DailyConfig.storageKey, JSON.stringify(chk)); } catch(e) {}
    };
    return;
  }

  let app;
  try { app = firebase.app(); } catch(e) { app = firebase.initializeApp(FIREBASE_CONFIG); }
  const db = firebase.database(app);
  _dbRef = db.ref('daily/' + DailyConfig.storageKey);

  try {
    const snap = await _dbRef.get();
    if (snap.exists()) {
      chk = snap.val() || {};
      try { localStorage.setItem(DailyConfig.storageKey, JSON.stringify(chk)); } catch(e) {}
      syncUIFromChk();
    }
    updateSyncStatus('online');

    _dbRef.on('value', (snap) => {
      if (_isSaving) return; 
      const incoming = snap.val() || {};
      if (JSON.stringify(incoming) !== JSON.stringify(chk)) {
        chk = incoming;
        try { localStorage.setItem(DailyConfig.storageKey, JSON.stringify(chk)); } catch(e) {}
        syncUIFromChk();
        updateSyncStatus('synced');
        setTimeout(() => updateSyncStatus('online'), 2500);
      }
    });

  } catch(e) {
    updateSyncStatus('offline');
  }
}

const NO_CB = new Set(['notes']);
const RSV_IDS = new Set(['rsv_pomo', 'transit']);

// ── [엔진 4] 초과 달성 연산 시스템 ──
function updateStats(){
  let reqTotal = 0, reqDone = 0, rsvTotal = 0, rsvDone = 0;
  let reqPomoTotal = 0, reqPomoDone = 0, rsvPomoDone = 0;

  S.forEach(b => {
    const isRsv = RSV_IDS.has(b.id) || b.cat === 'reserve';
    let bAll = b.items.length > 0;
    let bonusCheckedCount = 0; 
    
    b.items.forEach((_, i) => {
      const iid = b.id + '-' + i;
      if (!NO_CB.has(b.cat)) {
        if(isRsv) rsvTotal++; else reqTotal++;
        if (chk[iid]) {
          if (isRsv) rsvDone++; else reqDone++;
          bonusCheckedCount++; 
        } else {
          bAll = false;
        }
      } else {
        bAll = false;
      }
    });
    
    if (b.pomo !== undefined) {
      if (b.pomo === 'bonus') {
        rsvPomoDone += bonusCheckedCount;
      } else {
        reqPomoTotal++;
        if (bAll) reqPomoDone++;
      }
    }
  });

  const totalItemsDone = reqDone + rsvDone;
  const pct = reqTotal > 0 ? Math.round((totalItemsDone / reqTotal) * 100) : 0;
  
  const pPctEl = document.getElementById('pPct');
  if(pct > 100) {
     pPctEl.innerHTML = `${pct}% <span class="over-badge">🌟초과달성!</span>`;
     pPctEl.style.color = '#FFD700'; 
  } else {
     pPctEl.textContent = pct + '%';
     pPctEl.style.color = '#7EC8A0';
  }
  
  document.getElementById('pSub').textContent = totalItemsDone + ' / ' + reqTotal;
  document.getElementById('pFill').style.width = Math.min(pct, 100) + '%';
  
  const totalPomoDone = reqPomoDone + rsvPomoDone;
  const m = totalPomoDone * 25;
  document.getElementById('cPomo').textContent = totalPomoDone + '/' + reqPomoTotal;
  document.getElementById('cStudy').textContent = Math.floor(m/60) + 'h ' + (m%60) + 'm';
  document.getElementById('cAll').textContent = totalItemsDone + '/' + reqTotal;
}

function checkBlockDone(b){
  if (NO_CB.has(b.cat)) return;
  const all = b.items.every((_, i) => chk[b.id + '-' + i]);
  const el = document.getElementById('bl-' + b.id), dm = document.getElementById('dm-' + b.id);
  if (all){ el?.classList.add('all-done'); if(dm) dm.style.display = 'inline'; }
  else { el?.classList.remove('all-done'); if(dm) dm.style.display = 'none'; }
}

function updateStampUI() {
    let prevPts = (parseInt(chk['prev_stamps_count']) || 0) * 3;
    let todayPts = chk['stamp_points_today'] || 0;
    let totalPts = prevPts + todayPts;
    let displayPts = totalPts < 0 ? 0 : totalPts;

    let totalFull = Math.floor(displayPts / 3);
    let prevFull = Math.floor(prevPts / 3);
    let blueCount = Math.min(prevFull, totalFull);
    let redCount = totalFull - blueCount;
    let fraction = displayPts % 3;

    let html = '';
    for(let i=0; i<blueCount; i++) html += '<span class="stamp-icon stamp-prev">💮</span>';
    for(let i=0; i<redCount; i++) html += '<span class="stamp-icon stamp-today">💮</span>';
    if (fraction > 0) html += `<span class="stamp-fraction">+ ${fraction}/3</span>`;
    if (displayPts === 0) html += `<span style="font-size:11px; color:#A0A0A0; padding:5px;">현재 모은 도장이 없습니다. 뽀모도로를 완료해 보세요!</span>`;

    const disp = document.getElementById('stamp-display');
    if(disp) disp.innerHTML = html;
    const txt = document.getElementById('stamp-total-txt');
    if(txt) txt.textContent = `(총 도장: ${totalFull}개 ${fraction>0 ? `+ ${fraction}/3` : ''})`;
}

function render(){
  document.getElementById('el-date').textContent = DailyConfig.dateLabel;
  document.getElementById('el-badge1').textContent = DailyConfig.badge1;
  const b2 = document.getElementById('el-badge2');
  if(DailyConfig.badge2){ b2.textContent = DailyConfig.badge2; b2.style.display = 'inline-block'; }
  else{ b2.style.display = 'none'; }

  const root = document.getElementById('content'); root.innerHTML = '';
  let lastSec = '';

  if(DailyConfig.alert1HTML) {
    const al = document.createElement('div'); al.className = 'alert';
    al.innerHTML = DailyConfig.alert1HTML; root.appendChild(al);
  }
  if(DailyConfig.alert2HTML) {
    const al2 = document.createElement('div'); al2.className = 'alert-menses';
    al2.innerHTML = DailyConfig.alert2HTML; root.appendChild(al2);
  }

  // ── 💮 도장판 UI 생성 ──
  const stampBox = document.createElement('div');
  stampBox.className = 'stamp-wrap';
  stampBox.innerHTML = `
    <div class="stamp-ttl">💮 펭귄의 칭찬 도장판 <span id="stamp-total-txt" style="color:#A0A0A0; font-weight:400;"></span></div>
    <div class="stamp-interactive">
      <div style="font-size:11px; margin-bottom:8px; color:#555; font-weight:700;">
        전날까지 모은 도장: <input type="number" id="inputPrevStamps" style="width:45px; text-align:center; border:1px solid #ccc; border-radius:4px; font-weight:700; color:#2A6EA0;" min="0" value="${chk['prev_stamps_count'] || 0}"> 개
      </div>
      <div class="stamp-controls">
          <button class="btn-stamp" id="btnStampPomo">+ 1/3 (1뽀모)</button>
          <button class="btn-stamp" id="btnStampBonus">+ 1 (10뽀모 보너스)</button>
          <button class="btn-stamp use" id="btnStampUse">- 사용 (자유 차감)</button>
          <button class="btn-stamp undo" id="btnStampUndo">실수 취소</button>
      </div>
      <div class="stamp-guide">
          <strong style="color:#A04020;">[💡 도장 교환 가이드]</strong> (도장 1개 = 3뽀모 = 1.5시간 몰입)<br>
          ⏳ <strong>시간:</strong> 단순 오락(게임/유튜브) 1시간당 <strong>-1개</strong> / 생산적 취미(OC 로그/창작) 1시간당 <strong>-0.5개</strong><br>
          💬 <strong>상호작용:</strong> 자투리/쉬는 시간 역극 답장은 <strong>무료</strong> (단, 쉬는 시간 엄수)<br>
          💸 <strong>비용:</strong> 만원 이하 식사 <strong>무료</strong> / 고가 외식(만원 초과) 만원당 <strong>-1개</strong> / 취미용품 만원당 <strong>-1개</strong><br>
          🍩 <strong>건강:</strong> 달콤한 디저트·음료(당류) <strong>-1개</strong> / 음주 <strong>-2개</strong>
      </div>
    </div>
    <div class="stamp-display" id="stamp-display"></div>
  `;
  root.appendChild(stampBox);

  const iptPrev = stampBox.querySelector('#inputPrevStamps');
  iptPrev.addEventListener('input', (e) => {
      chk['prev_stamps_count'] = parseInt(e.target.value) || 0;
      saveState(); updateStampUI();
  });

  stampBox.querySelector('#btnStampPomo').addEventListener('click', () => { chk['stamp_points_today'] = (chk['stamp_points_today'] || 0) + 1; saveState(); updateStampUI(); });
  stampBox.querySelector('#btnStampBonus').addEventListener('click', () => { chk['stamp_points_today'] = (chk['stamp_points_today'] || 0) + 3; saveState(); updateStampUI(); });
  stampBox.querySelector('#btnStampUse').addEventListener('click', () => { 
      let val = prompt('사용할 도장 개수를 입력하세요 (예: 2.5, 5 등)\n가이드에 따라 합리적으로 차감해보세요!', '1');
      if(val !== null) {
          let num = parseFloat(val);
          if(!isNaN(num) && num > 0) {
              chk['stamp_points_today'] = (chk['stamp_points_today'] || 0) - (num * 3);
              saveState(); updateStampUI();
          }
      }
  });
  stampBox.querySelector('#btnStampUndo').addEventListener('click', () => { chk['stamp_points_today'] = (chk['stamp_points_today'] || 0) - 1; saveState(); updateStampUI(); });

  let lastBlock;
  S.forEach(b => {
    lastBlock = b;
    const cs = C[b.cat] || C.notes; const nc = NO_CB.has(b.cat);
    if (b.sec && b.sec !== lastSec){
      const sl = document.createElement('div'); sl.className = 'sec'; sl.textContent = b.sec;
      root.appendChild(sl); lastSec = b.sec;
    }
    const wrap = document.createElement('div'); wrap.className = 'blk'; wrap.id = 'bl-' + b.id; wrap.style.cssText = `background:${cs.bg};border-color:${cs.bd}`;
    let hdrHTML = `<div class="blk-hdr" style="background:${cs.dot}12;border-bottom-color:${cs.bd}30"><div class="dot" style="background:${cs.dot}"></div>`;
    if(b.time) hdrHTML += `<span class="btime" style="color:${cs.dot}">${b.time}</span>`;
    hdrHTML += `<span class="bcat" style="background:${cs.dot}22;color:${cs.dot}">${cs.lbl}</span>`;
    if(!nc) hdrHTML += `<span class="btn-check-all" id="all-${b.id}" style="color:${cs.dot}">ALL</span>`;
    hdrHTML += `<span class="btitle">${b.title}</span>`;
    if(b.dur) hdrHTML += `<span class="bdur" style="background:${cs.dot}18;color:${cs.dot}">${b.dur}</span>`;
    hdrHTML += `<span class="done-mark" id="dm-${b.id}">✅</span></div>`;
    wrap.innerHTML = hdrHTML;

    const btnAll = wrap.querySelector(`#all-${b.id}`);
    if(btnAll) {
      btnAll.addEventListener('click', (e) => {
        e.preventDefault();
        const isAllDone = b.items.every((_, i) => chk[b.id + '-' + i]);
        b.items.forEach((_, i) => {
          const iid = b.id + '-' + i; chk[iid] = !isAllDone;
          const cb = document.getElementById(iid); if(cb) cb.checked = !isAllDone;
          const tx = document.getElementById('tx-' + iid); if(tx) tx.classList.toggle('done', !isAllDone);
        });
        checkBlockDone(b); updateStats(); saveState();
      });
    }

    const body = document.createElement('div'); body.className = 'blk-body';
    b.items.forEach((item, i) => {
      const iid = b.id + '-' + i; const isW = /^(\【주의\】|\【사실\】|\【CBT\】|\【외출 준비\】|⚠️|🌙|💧|📵|🎙️|🧘|⏰|🚫|🔑|✅|👀|🧠|🎧)/.test(item);
      const row = document.createElement(nc ? 'div' : 'label'); row.className = 'irow' + (nc ? ' nc' : ''); if (!nc) row.htmlFor = iid;
      if (nc){ row.innerHTML = `<span class="ibullet" style="color:${cs.dot}">•</span>`; }
      else {
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = iid; cb.style.accentColor = cs.dot; cb.checked = !!chk[iid];
        cb.addEventListener('change', () => { chk[iid] = cb.checked; document.getElementById('tx-' + iid).classList.toggle('done', cb.checked); checkBlockDone(b); updateStats(); saveState(); });
        row.appendChild(cb);
      }
      const tx = document.createElement('span'); tx.className = 'itxt' + (isW ? ' warn' : '');
      tx.id = 'tx-' + iid; tx.style.color = isW ? cs.tc : '#2A2010'; tx.textContent = item;
      if (chk[iid]) tx.classList.add('done'); row.appendChild(tx); body.appendChild(row);
    });

    if(b.pomo !== undefined || b.cat === 'reserve') {
        const pmId = 'pmemo-' + b.id;
        const pmInput = document.createElement('input');
        pmInput.type = 'text';
        pmInput.id = 'pmemo-input-' + b.id;  
        pmInput.className = 'pomo-memo'; pmInput.spellcheck = false;
        pmInput.placeholder = '✏️ 이 시간에 어떤 과제를 했는지 기록하세요...';
        pmInput.value = chk[pmId] || '';
        pmInput.addEventListener('input', (e) => { chk[pmId] = e.target.value; saveState(); });
        body.appendChild(pmInput);
    }

    wrap.appendChild(body); root.appendChild(wrap);
  });

  const wb = document.createElement('div'); wb.className = 'week-box';
  wb.innerHTML = `<div class="week-ttl">주간 마인드셋 & 일정 미리보기</div>`;
  W.forEach(w => { wb.innerHTML += `<div class="wrow"><span class="wdate ${w.today ? 'today' : ''}">${w.d}</span><span class="wdesc">${w.t}</span></div>`; });
  root.appendChild(wb);
  const ft = document.createElement('div'); ft.className = 'footer';
  ft.innerHTML = `<div style="font-size:20px;margin-bottom:6px">🔥</div><div style="font-size:14px;font-weight:700;font-family:'DM Serif Display',serif">${DailyConfig.footerQuote}</div>`;
  root.appendChild(ft);
  
  if(lastBlock) checkBlockDone(lastBlock); updateStats(); updateStampUI();
}

// ── 데이터 복사/내보내기 로직 ──
document.getElementById('btnExport').addEventListener('click', () => {
  const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(chk))));
  navigator.clipboard.writeText(dataStr).then(() => alert('데이터 임시 복사 완료!')).catch(() => prompt('수동 복사:', dataStr));
});
document.getElementById('btnImport').addEventListener('click', () => {
  const input = prompt('데이터 코드를 넣어주세요:');
  if(input) { try { chk = JSON.parse(decodeURIComponent(escape(atob(input)))); saveState(); location.reload(); } catch(e) { alert('잘못된 코드입니다.'); } }
});
document.getElementById('btnGithubExport').addEventListener('click', () => {
  const rx = /🩸|생리|정신과|약 복용|알약|자나팜정|에프람정|모리티톤정|진료|⚕️|CBT/i;
  const rxP = /\s*\([^)]*(생리|진료|시간 배분|CBT)[^)]*\)/g;
  
  let eD = 0, eT = 0, rD = 0, rT = 0, pD = 0, reqPomoTotal = 0;
  const expS = S.filter(b => b.cat !== 'meds').map(b => {
      const isR = RSV_IDS.has(b.id) || b.cat === 'reserve';
      if (!NO_CB.has(b.cat) && !isR) eT += b.items.length; 
      if (isR) rT += b.items.length;
      
      let bA = b.items.length > 0; 
      let bonusCount = 0;

      const filteredItems = b.items.map((it, i) => {
          const iid = b.id + '-' + i;
          if(!NO_CB.has(b.cat)) {
              if(chk[iid]) {
                  if(isR) rD++; else eD++;
                  bonusCount++;
              } else {
                  bA = false;
              }
          } else {
              bA = false;
          }
          return { t: it, id: iid };
      }).filter(it => !rx.test(it.t));
      
      if (b.pomo !== undefined) {
          if (b.pomo === 'bonus') {
              pD += bonusCount;
          } else {
              reqPomoTotal++;
              if (bA) pD++;
          }
      }

      return {
          ...b, sec: b.sec ? b.sec.replace(rx, '').replace(rxP, '') : '', title: b.title.replace(rx, '').replace(rxP, ''),
          items: filteredItems
      };
  });
  
  const expW = W.map(w => ({ ...w, t: w.t.replace(/🩸\s*|⚕️\s*|🗣️\s*/g, '').replace(rxP, '').replace(/\s*&\s*진료/, '').replace(/CBT 상담/i, '멘탈 점검') }));
  
  const totalItemsDone = eD + rD;
  const pct = eT > 0 ? Math.round((totalItemsDone / eT) * 100) : 0;
  const pctHTML = pct > 100 ? `${pct}% <span class="over-badge">🌟초과달성!</span>` : `${pct}%`;
  const sm = pD * 25;

  let html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${DailyConfig.dateLabel} 기록</title><style>${document.querySelector('style').innerHTML.replace('.btn-check-all{', '.btn-check-all{display:none;')}</style></head><body>`;
  html += `<div id="hdr"><div class="hdr-row"><div class="hdr-l"><div class="date-lbl">${DailyConfig.dateLabel}</div><div class="title">펭귄 일정표 📋</div><div class="badge-row"><span class="badge">${DailyConfig.badge1}</span></div></div><div class="hdr-r"><div class="pct-big" style="color:${pct>100?'#FFD700':'#7EC8A0'}">${pctHTML}</div><div class="pct-sub">${totalItemsDone} / ${eT}</div></div></div><div class="pbar-wrap"><div class="pbar-fill" style="width:${Math.min(pct, 100)}%"></div></div><div class="chips"><div class="chip">🍅 완료: <b>${pD}/${reqPomoTotal}</b></div><div class="chip">⏱️ 순공: <b>${Math.floor(sm/60)}h ${sm%60}m</b></div><div class="chip">✅ 전체: <b>${totalItemsDone}/${eT}</b></div></div></div><div id="content">`;
  if(DailyConfig.alert1HTML) html += `<div class="alert">${DailyConfig.alert1HTML.replace(rx, '').replace(rxP, '').replace(/CBT/g, '마인드셋')}</div>`;
  
  const stampHTML = document.querySelector('.stamp-wrap').innerHTML;
  const cleanStampHTML = stampHTML.replace(/<div class="stamp-interactive">[\s\S]*?<!--interactive-end-->/, '');
  html += `<div class="stamp-wrap">${cleanStampHTML}</div>`;

  let lS = ''; expS.forEach(b => {
      const cs = C[b.cat] || C.notes; const nc = NO_CB.has(b.cat);
      if (b.sec && b.sec !== lS){ html += `<div class="sec">${b.sec}</div>`; lS = b.sec; }
      let bA = b.items.length > 0 && b.items.every(it => chk[it.id]); if (nc) bA = false;
      html += `<div class="blk ${bA ? 'all-done' : ''}" style="background:${cs.bg};border-color:${cs.bd}"><div class="blk-hdr" style="background:${cs.dot}12;border-bottom-color:${cs.bd}30"><div class="dot" style="background:${cs.dot}"></div>`;
      if (b.time) html += `<span class="btime" style="color:${cs.dot}">${b.time}</span>`;
      html += `<span class="bcat" style="background:${cs.dot}22;color:${cs.dot}">${cs.lbl}</span><span class="btitle">${b.title}</span>`;
      if (b.dur) html += `<span class="bdur" style="background:${cs.dot}18;color:${cs.dot}">${b.dur}</span>`;
      html += `<span class="done-mark" style="display:${bA ? 'inline' : 'none'}">✅</span></div><div class="blk-body">`;
      
      b.items.forEach(it => { const iC = !!chk[it.id]; const iW = /^(\【주의\】|\【팩트\】|\【외출 준비\】|⚠️|🌙|💧|📵|🎙️|🧘|⏰|🚫|🔑|✅|👀|🧠|🎧)/.test(it.t);
          html += `<label class="irow ${nc ? 'nc' : ''}" style="cursor:default;">`;
          if (nc) html += `<span class="ibullet" style="color:${cs.dot}">•</span>`; else html += `<input type="checkbox" disabled ${iC ? 'checked' : ''} style="margin-top:3px;flex-shrink:0;width:13px;height:13px;cursor:default;accent-color:${cs.dot}">`;
          html += `<span class="itxt ${iW ? 'warn' : ''} ${iC ? 'done' : ''}" style="color:${iW ? cs.tc : '#2A2010'};font-size:12.5px;line-height:1.55;">${it.t.replace(/【CBT】/g, '【마인드셋】')}</span></label>`;
      }); 

      if(b.pomo !== undefined || b.cat === 'reserve') {
          const pmId = 'pmemo-' + b.id;
          const savedMemo = chk[pmId] || '';
          const filteredMemo = savedMemo.replace(rx, '').replace(rxP, '').replace(/CBT/gi, '마인드셋');
          if(filteredMemo.trim() !== '') {
              html += `<div style="border-top:1px dashed rgba(0,0,0,0.15); margin-top:7px; padding-top:7px; font-size:11.5px; color:#555; line-height:1.5;"><strong>✏️ 내가 한 일:</strong> ${filteredMemo}</div>`;
          }
      }

      html += `</div></div>`;
  });
  html += `<div class="sec">주간 마인드셋 & 일정 미리보기</div><div class="week-box">`;
  expW.forEach(w => { html += `<div class="wrow"><span class="wdate ${w.today ? 'today' : ''}">${w.d}</span><span class="wdesc">${w.t}</span></div>`; });
  html += `</div><div class="footer"><div style="font-size:20px;margin-bottom:6px">🔥</div><div style="font-size:14px;font-weight:700;font-family:'DM Serif Display',serif">${DailyConfig.footerQuote}</div></div></div></body></html>`;
  const fD = DailyConfig.dateLabel.split(' ')[0].replace(/\./g, '-');
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `${fD}_complete.html`; a.click(); URL.revokeObjectURL(url);
});

initApp();
</script>
</body>
</html>
